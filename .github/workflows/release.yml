name: Release macOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Optional stable version without v (e.g. 1.5.0). Omit to increment the latest patch."
        required: false

concurrency:
  group: release-macos-app
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare-release:
    if: github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - macOS
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      should_release: ${{ steps.metadata.outputs.should_release }}
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Test release version selection and publication
        run: |
          python3 -B scripts/test-release-version.py
          python3 -B scripts/test-publish-release.py

      - name: Resolve release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: python3 scripts/release-version.py

      - name: Validate update signing configuration
        if: steps.metadata.outputs.should_release == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$SPARKLE_PRIVATE_KEY" && -n "$SPARKLE_PUBLIC_ED_KEY" ]] || {
            echo "Configure SPARKLE_PRIVATE_KEY and SPARKLE_PUBLIC_ED_KEY repository secrets before releasing." >&2
            exit 1
          }
          python3 -c 'import base64, os; assert len(base64.b64decode(os.environ["SPARKLE_PUBLIC_ED_KEY"], validate=True)) == 32, "Invalid Sparkle public key"'

      - name: Report already published commit
        if: steps.metadata.outputs.should_release != 'true'
        run: echo "This commit already has a published stable release."

  release:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on:
      - self-hosted
      - macOS
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
      TAG: ${{ needs.prepare-release.outputs.tag }}
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set archive paths
        run: |
          {
            echo "ZIP_PATH=$GITHUB_WORKSPACE/dist/TartDesk-$VERSION-macOS.zip"
            echo "CHECKSUM_PATH=$GITHUB_WORKSPACE/dist/TartDesk-$VERSION-macOS.zip.sha256"
          } >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          CERT_BASE64_PATH="$RUNNER_TEMP/developer-id.p12.b64"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          echo "CERT_PATH=$CERT_PATH" >> "$GITHUB_ENV"
          echo "CERT_BASE64_PATH=$CERT_BASE64_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          printf '%s' "$APPLE_CERT_BASE64" > "$CERT_BASE64_PATH"
          base64 -D -i "$CERT_BASE64_PATH" -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          [[ -n "$SIGNING_IDENTITY" ]] || { echo "Developer ID Application identity not found" >&2; exit 1; }

          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build app bundle
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: APP_VERSION="$VERSION" BUILD_ARCH=arm64 ./scripts/build-app.sh

      - name: Verify packaged release version
        run: |
          set -euo pipefail
          PLIST="dist/TartDesk.app/Contents/Info.plist"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" == "$VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" == "$VERSION" ]]

      - name: Verify app architecture
        run: |
          set -euo pipefail
          APP_BINARY="dist/TartDesk.app/Contents/MacOS/TartDesk"
          ARCH_INFO="$(file "$APP_BINARY")"
          echo "$ARCH_INFO"
          echo "$ARCH_INFO" | grep -q "arm64"

      - name: Sign app bundle
        run: |
          set -euo pipefail
          bash scripts/sign-app.sh "dist/TartDesk.app"

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Create signed archive for notarization
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --keepParent "dist/TartDesk.app" "$ZIP_PATH"

      - name: Notarize app archive
        run: |
          set -euo pipefail
          xcrun notarytool submit "$ZIP_PATH" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_API_ISSUER_ID }}" \
            --wait

      - name: Staple notarization ticket
        run: |
          set -euo pipefail
          xcrun stapler staple "dist/TartDesk.app"
          xcrun stapler validate "dist/TartDesk.app"

      - name: Recreate release archive and checksum
        run: |
          set -euo pipefail
          rm -f "$ZIP_PATH" "$CHECKSUM_PATH"
          ditto -c -k --keepParent "dist/TartDesk.app" "$ZIP_PATH"
          shasum -a 256 "$ZIP_PATH" > "$CHECKSUM_PATH"

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_BIN: .build/artifacts/sparkle/Sparkle/bin
        run: bash scripts/generate-appcast.sh

      - name: Publish complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh

      - name: Cleanup signing keychain
        if: always()
        run: |
          set +e

          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security default-keychain -s login.keychain-db || true
            security list-keychains -d user -s login.keychain-db || true
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

          rm -f "${CERT_PATH:-}" "${CERT_BASE64_PATH:-}" "${APPLE_API_KEY_PATH:-}"
