name: Release macOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Optional stable version without v (e.g. 1.5.0). Omit to increment the latest patch."
        required: false
      validate_only:
        description: "Validate signing, ZIP and DMG without publishing"
        type: boolean
        default: false

concurrency:
  group: release-macos-app
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare-release:
    if: github.repository == 'mohnya-org/TartDesk' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.validate_only))
    runs-on:
      - self-hosted
      - macOS
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      should_release: ${{ steps.metadata.outputs.should_release }}
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Test release version selection and publication
        run: |
          python3 -B scripts/test-release-version.py
          python3 -B scripts/test-publish-release.py
          python3 -B scripts/test-macos-dmg.py
          python3 -B scripts/test-keychain-lock.py
          python3 -B scripts/test-release-security.py

      - name: Resolve release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: python3 scripts/release-version.py

      - name: Validate distribution secrets before build
        if: steps.metadata.outputs.should_release == 'true' || inputs.validate_only
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: python3 scripts/release-security.py preflight

      - name: Report already published commit
        if: steps.metadata.outputs.should_release != 'true' && !inputs.validate_only
        run: echo "This commit already has a published stable release."

  release:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true' || inputs.validate_only
    runs-on:
      - self-hosted
      - macOS
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
      TAG: ${{ needs.prepare-release.outputs.tag }}
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set archive paths
        run: |
          {
            echo "ZIP_PATH=$GITHUB_WORKSPACE/dist/TartDesk-$VERSION-macOS.zip"
            echo "DMG_PATH=$GITHUB_WORKSPACE/dist/TartDesk-$VERSION-macOS.dmg"
            echo "CHECKSUM_PATH=$GITHUB_WORKSPACE/dist/TartDesk-$VERSION-macOS.zip.sha256"
          } >> "$GITHUB_ENV"

      - name: Build app bundle
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: DISTRIBUTION_BUILD=1 APP_VERSION="$VERSION" BUILD_ARCH=arm64 ./scripts/build-app.sh

      - name: Verify packaged release version
        run: |
          set -euo pipefail
          PLIST="dist/TartDesk.app/Contents/Info.plist"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" == "$VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" == "$VERSION" ]]

      - name: Verify app architecture
        run: |
          set -euo pipefail
          APP_BINARY="dist/TartDesk.app/Contents/MacOS/TartDesk"
          ARCH_INFO="$(file "$APP_BINARY")"
          echo "$ARCH_INFO"
          echo "$ARCH_INFO" | grep -q "arm64"

      - name: Sign, notarize, and verify final distribution
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: bash scripts/notarize-release.sh

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_BIN: .build/artifacts/sparkle/Sparkle/bin
        run: bash scripts/generate-appcast.sh

      - name: Set up Python for DMG layout
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install pinned DMG layout tools
        run: |
          set -euo pipefail
          tools_dir="$(mktemp -d "$RUNNER_TEMP/dmg-tools.XXXXXX")"
          echo "DMG_TOOLS_DIR=$tools_dir" >> "$GITHUB_ENV"
          python3 -m venv "$tools_dir"
          "$tools_dir/bin/python" -m pip install --disable-pip-version-check --require-hashes -r scripts/dmg-requirements.txt

      - name: Create signed and notarized first-install DMG
        timeout-minutes: 35
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: '"$DMG_TOOLS_DIR/bin/python" -B scripts/macos-dmg.py create "dist/TartDesk.app" "$DMG_PATH"'

      - name: Keep validated installers for verification runs
        if: inputs.validate_only
        uses: actions/upload-artifact@v4
        with:
          name: TartDesk-validated-distribution
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          retention-days: 7

      - name: Publish complete GitHub Release
        if: github.ref == 'refs/heads/main' && !inputs.validate_only
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh

      - name: Cleanup signing files after interrupted step
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${SIGNING_TEMP_DIR:-}" && -d "$SIGNING_TEMP_DIR" ]]; then
            cleanup_status=0
            python3 scripts/signing-keychain.py detach "$SIGNING_TEMP_DIR/signing.keychain-db" || cleanup_status=$?
            python3 scripts/keychain_lock.py delete-keychain "$SIGNING_TEMP_DIR/signing.keychain-db" >/dev/null 2>&1 || true
            rm -rf "$SIGNING_TEMP_DIR"
            exit "$cleanup_status"
          fi

      - name: Cleanup DMG signing material
        if: always()
        run: |
          if [[ -n "${DMG_SIGNING_TEMP_DIR:-}" ]]; then
            python3 -B scripts/macos-dmg.py cleanup "$DMG_SIGNING_TEMP_DIR"
          fi

      - name: Cleanup DMG layout tools
        if: always()
        run: |
          if [[ -n "${DMG_TOOLS_DIR:-}" ]]; then rm -rf "$DMG_TOOLS_DIR"; fi
